name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, e.g. v0.1.0"
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cd target/release
          7z a ../../dist/myRDCcenter-egui-windows-x64.zip myRDCcenter-egui.exe
          7z a ../../dist/myRDCcenter-slint-windows-x64.zip myRDCcenter-slint.exe
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/* }

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libfontconfig1-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - name: Package
        run: |
          mkdir -p dist pkg/myRDCcenter
          cp target/release/myRDCcenter-egui target/release/myRDCcenter-slint README.md pkg/myRDCcenter/
          cp assets/icon-256.png pkg/myRDCcenter/myRDCcenter.png
          cp packaging/linux/*.desktop pkg/myRDCcenter/
          tar -C pkg -czf dist/myRDCcenter-linux-x64.tar.gz myRDCcenter
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/* }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo build --release --workspace --target aarch64-apple-darwin
          cargo build --release --workspace --target x86_64-apple-darwin
      - name: Package universal .app in .dmg
        run: |
          mkdir dist
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          # Build the .icns app icon from the 1024 px PNG.
          mkdir icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/icon-1024.png --out icon.iconset/icon_${size}x${size}.png
            sips -z $((size*2)) $((size*2)) assets/icon-1024.png --out icon.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns icon.iconset -o AppIcon.icns
          for app in egui slint; do
            BIN=myRDCcenter-$app
            APP="dist/$app/myRDCcenter ($app).app"
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
            cp AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
            lipo -create -output "$APP/Contents/MacOS/$BIN" \
              target/aarch64-apple-darwin/release/$BIN target/x86_64-apple-darwin/release/$BIN
            sed -e "s/@BIN@/$BIN/g" -e "s/@NAME@/myRDCcenter ($app)/g" -e "s/@VERSION@/$VERSION/g" \
              packaging/macos/Info.plist > "$APP/Contents/Info.plist"
            codesign --force --deep --sign - "$APP"
            ln -s /Applications "dist/$app/Applications"
            hdiutil create -volname "myRDCcenter ($app)" -srcfolder "dist/$app" -ov -format UDZO "dist/myRDCcenter-$app-macos.dmg"
          done
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/*.dmg }

  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
