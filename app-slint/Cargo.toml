[package]
name = "myrdccenter-slint"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "myRDCcenter-slint"
path = "src/main.rs"

[dependencies]
myrdc-core = { path = "../core" }
# femtovg on wgpu draws with Direct3D 12 / Vulkan / Metal. It resizes smoothly;
# the default OpenGL renderer (femtovg) stutters while the window is resized.
slint = { version = "1.18", features = ["renderer-femtovg-wgpu", "unstable-winit-030"] }
rfd = "0.17"
uuid = "1"

[features]
# Save a PNG screenshot and exit; see core/src/screenshot.rs.
screenshot = ["myrdc-core/screenshot"]

[build-dependencies]
winresource = "0.1"
slint-build = "1.18"
