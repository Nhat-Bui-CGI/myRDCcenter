[package]
name = "myrdccenter-egui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "myRDCcenter-egui"
path = "src/main.rs"

[dependencies]
myrdc-core = { path = "../core" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
rfd = "0.17"
uuid = "1"

[build-dependencies]
winresource = "0.1"
